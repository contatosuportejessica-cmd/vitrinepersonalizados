<script>
(function(){

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function sanitizeRichStyle(value){
    var out = [];
    var parts = String(value == null ? '' : value).split(';');
    for (var i=0;i<parts.length;i++){
      var part = parts[i];
      var idx = part.indexOf(':');
      if (idx < 0) continue;
      var prop = part.slice(0, idx).trim().toLowerCase();
      var val = part.slice(idx + 1).trim().toLowerCase();
      if (prop === 'text-align' && /^(left|right|center|justify)$/.test(val)) out.push('text-align:' + val);
      else if (prop === 'font-weight' && /^(bold|[6-9]00)$/.test(val)) out.push('font-weight:' + val);
      else if (prop === 'font-style' && val === 'italic') out.push('font-style:italic');
      else if (prop === 'text-decoration') {
        var deco = [];
        if (/\bunderline\b/.test(val)) deco.push('underline');
        if (/\bline-through\b/.test(val)) deco.push('line-through');
        if (deco.length) out.push('text-decoration:' + deco.join(' '));
      }
    }
    return out.join(';');
  }
  function sanitizeRichHtml(value){
    var raw = String(value == null ? '' : value);
    if (!raw) return '';
    var tpl = document.createElement('template');
    tpl.innerHTML = raw;
    var allowed = { p:1, br:1, div:1, span:1, strong:1, b:1, em:1, i:1, u:1, s:1, strike:1, del:1, h1:1, h2:1, h3:1, h4:1, h5:1, h6:1, ul:1, ol:1, li:1, a:1, blockquote:1, pre:1, code:1, hr:1, img:1, sub:1, sup:1 };
    var drop = { script:1, style:1, iframe:1, object:1, embed:1, link:1, meta:1, base:1, form:1, input:1, button:1, textarea:1, select:1, option:1, svg:1, math:1, video:1, audio:1, source:1, track:1, canvas:1, noscript:1, template:1 };
    var attrs = { a: { href:1, title:1, target:1 }, img: { src:1, alt:1, title:1, width:1, height:1 } };
    function safeUrl(v, image){
      var raw2 = String(v == null ? '' : v).trim();
      if (!raw2) return false;
      var compact = raw2.replace(/[\u0000-\u0020]+/g, '').toLowerCase();
      var m = /^([a-z][a-z0-9+.-]*):/.exec(compact);
      if (!m) return true;
      var s = m[1];
      if (image) return s === 'http' || s === 'https' || (s === 'data' && /^data:image\/(?:png|jpe?g|gif|webp|avif);/i.test(compact));
      return s === 'http' || s === 'https' || s === 'mailto' || s === 'tel';
    }
    function walk(node){
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var i=0;i<kids.length;i++){
        var child = kids[i];
        if (child.nodeType === 8) { child.parentNode.removeChild(child); continue; }
        if (child.nodeType !== 1) continue;
        var tag = child.tagName.toLowerCase();
        if (drop[tag]) { child.parentNode.removeChild(child); continue; }
        walk(child);
        if (!allowed[tag]) {
          var parent = child.parentNode;
          while (child.firstChild) parent.insertBefore(child.firstChild, child);
          parent.removeChild(child);
          continue;
        }
        var list = Array.prototype.slice.call(child.attributes);
        var allowedAttrs = attrs[tag] || {};
        for (var k=0;k<list.length;k++){
          var attr = list[k];
          var name = attr.name.toLowerCase();
          if (name === 'style') {
            var style = sanitizeRichStyle(attr.value);
            if (style) child.setAttribute('style', style);
            else child.removeAttribute(attr.name);
            continue;
          }
          if (name.indexOf('on') === 0 || !allowedAttrs[name]) { child.removeAttribute(attr.name); continue; }
          if (name === 'href' && !safeUrl(attr.value, false)) child.removeAttribute(attr.name);
          if (name === 'src' && !safeUrl(attr.value, true)) child.removeAttribute(attr.name);
          if (name === 'target' && !/^_(?:blank|self|parent|top)$/i.test(attr.value)) child.removeAttribute(attr.name);
          if ((name === 'width' || name === 'height') && !/^\d{1,5}$/.test(attr.value)) child.removeAttribute(attr.name);
        }
        if (tag === 'a') {
          if (!child.getAttribute('href')) {
            var p2 = child.parentNode;
            while (child.firstChild) p2.insertBefore(child.firstChild, child);
            p2.removeChild(child);
            continue;
          }
          child.setAttribute('rel', 'noopener noreferrer');
        }
        if (tag === 'img' && !child.getAttribute('src')) child.parentNode.removeChild(child);
      }
    }
    walk(tpl.content);
    return tpl.innerHTML;
  }
  function plainTextToHtml(value){
    var raw = String(value == null ? '' : value).replace(/\r\n?/g, '\n');
    if (!raw.trim()) return '';
    return raw.split(/\n{2,}/).filter(function(part){ return part.trim(); }).map(function(part){ return '<p>' + esc(part).split('\n').join('<br>') + '</p>'; }).join('');
  }
  function richTextToHtml(value){
    var raw = String(value == null ? '' : value);
    if (!raw.trim()) return '';
    if (/<\/?(?:p|br|div|span|strong|b|em|i|u|s|strike|del|h[1-6]|ul|ol|li|a|blockquote|pre|code|hr|img|sub|sup|script|style|iframe|object|embed)\b[^>]*>/i.test(raw)) return sanitizeRichHtml(raw);
    return plainTextToHtml(raw);

    function submit(){

    var list = filtered();
    var feat = list.filter(function(p){ return p.featured; });
    var rest = list.filter(function(p){ return !p.featured; });
    app.innerHTML = headerHtml() + '<div class="wrap">' +
      (area.heroEnabled ? '<section class="hero' + (area.heroAlign==='center'?' center':'') + '">' +
        ((area.bannerDesktop || area.bannerMobile) ? '<div class="bgimg desk" style="background-image:url(\'' + String(area.bannerDesktop || area.bannerMobile).replace(/'/g,'%27') + '\')"></div>' : '') +
        (area.bannerMobile ? '<div class="bgimg mob" style="background-image:url(\'' + String(area.bannerMobile).replace(/'/g,'%27') + '\')"></div>' : '') +
        ((area.bannerDesktop || area.bannerMobile) ? '<div class="veil"></div>' : '') +
        '<div class="ct">' +
          '<h1>' + esc(area.title || area.name) + '</h1>' +
          (area.subtitle ? '<p class="sub">' + esc(area.subtitle) + '</p>' : '') +
          (area.heroSupport ? '<p class="supp">' + esc(area.heroSupport) + '</p>' : '') +
          (area.heroButtonLabel ? '<a class="btn" style="margin-top:6px" href="' + esc(area.heroButtonUrl || '#') + '" target="_blank" rel="noopener">' + esc(area.heroButtonLabel) + '</a>' : '') +
        '</div></section>' : '') +
      ((area.searchEnabled && !area.headerSearch) ? '<div class="searchbar">' + ICON + '<input class="search" id="q" placeholder="' + esc(area.searchPlaceholder) + '" value="' + esc(state.q) + '" /></div>' : '') +
      '<div class="chips"><button class="chip' + (state.cat==='all'?' active':'') + '" data-cat="all">Todos</button>' +
        cats.map(function(c){ return '<button class="chip' + (state.cat===c.id?' active':'') + '" data-cat="' + esc(c.id) + '">' + esc(c.name) + '</button>'; }).join('') +
      '</div>' +
      '<main>' +
        (feat.length ? '<section><div class="sechead"><h2 class="sec featured-title">🔥 ' + esc(area.featuredLabel) + '</h2><span class="count">' + feat.length + '</span></div><div class="grid feat">' + feat.map(cardHtml).join('') + '</div></section>' : '') +
        '<section><div class="sechead"><h2 class="sec">' + esc(area.allLabel) + '</h2><span class="count">' + rest.length + '</span></div>' +
          (rest.length ? '<div class="grid">' + rest.map(cardHtml).join('') + '</div>' : '<p class="empty">Nenhum produto encontrado.</p>') +
        '</section>' +
      '</main></div>' +
      '<footer>' + esc(area.name) + '</footer>';

    bindHeader();
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(b){
      b.onclick = function(){ state.cat = b.getAttribute('data-cat'); renderHome(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('.card'), function(b){
      b.onclick = function(){
        var id = b.getAttribute('data-id');
        for (var i=0;i<prods.length;i++) if (prods[i].id===id) state.product = prods[i];
        render(); window.scrollTo(0,0);
      };
    });
  }

  function showWelcome(){
    var WK = 'tm-showcase-welcome:' + (area.name || 'vitrine');
    if (!area.welcomeEnabled || !user || localStorage.getItem(WK)) return;
     var first = displayUserName(user).split(' ')[0];
    var sub = function(t){ return String(t||'').replace(/\{nome\}/gi, first); };
    var el = document.createElement('div'); el.className = 'wel';
    el.innerHTML = '<div class="bx"><h3>' + esc(sub(area.welcomeTitle)) + '</h3><div class="m">' + esc(sub(area.welcomeMessage)) + '</div>' +
      (area.welcomeRequireTerms ? '<label><input type="checkbox" id="wt" /> ' + esc(area.welcomeTerms) + '</label>' : '') +
      '<button class="btn" id="wb"' + (area.welcomeRequireTerms ? ' disabled' : '') + '>' + esc(area.welcomeButton) + '</button></div>';
    app.appendChild(el);
    var wt = document.getElementById('wt'), wb = document.getElementById('wb');
    if (wt) wt.onchange = function(){ wb.disabled = !wt.checked; };
    wb.onclick = function(){ localStorage.setItem(WK,'1'); el.remove(); };
  }

  function render(){
    if (!state.unlocked) return renderGate();
    if (state.product) return renderDetail(state.product);
    renderHome();
  }
  render();
})();
</script>
</body>
</html>
